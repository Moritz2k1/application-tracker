<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #282c34;
      }
    }
    #editor, .cm-editor {
      height: 100%;
    }
    .cm-editor {
      font-size: 13px;
    }
    .cm-editor.cm-focused {
      outline: none;
    }
    .cm-scroller {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <editor-bundle></editor-bundle>
</body>
</html>
