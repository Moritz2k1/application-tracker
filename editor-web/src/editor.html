<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #282c34;
      }
    }
    #editor, .cm-editor {
      height: 100%;
    }
    .cm-editor {
      font-size: 13px;
    }
    .cm-editor.cm-focused {
      outline: none;
    }
    .cm-scroller {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      line-height: 1.5;
    }
    @media (prefers-color-scheme: light) {
      #editor .cm-editor .cm-cursor {
        border-left: 2px solid #1E4FD8;
      }
      #editor .cm-editor .cm-activeLine {
        background: rgba(30, 79, 216, 0.05);
      }
      #editor .cm-editor .cm-gutters {
        background: #F7F8FA;
        border-right: 1px solid #E6E9F0;
        color: #8A94A6;
      }
      #editor .cm-editor .cm-activeLineGutter {
        background: rgba(30, 79, 216, 0.08);
        color: #1E4FD8;
      }
      #editor .cm-editor .cm-selectionLayer .cm-selectionBackground {
        background: rgba(79, 168, 255, 0.28);
      }
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <editor-bundle></editor-bundle>
</body>
</html>
